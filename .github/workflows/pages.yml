name: Website

# Publishes website/ to GitHub Pages at https://mdedit.satran.in/ whenever it changes.
# One-time setup: Settings > Pages > Source: "GitHub Actions"; custom domain mdedit.satran.in; Enforce HTTPS.

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage the site (without the maintainer notes)
        run: rsync -a --exclude README.md --exclude SCREENSHOTS.md website/ _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
