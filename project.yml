name: MDEdit
options:
  bundleIdPrefix: in.ranjeev
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "0.2.1"
    CURRENT_PROJECT_VERSION: "3"
packages:
  swift-markdown:
    url: https://github.com/swiftlang/swift-markdown.git
    from: "0.5.0"
targets:
  MDEdit:
    type: application
    platform: macOS
    sources: [Sources/MDEdit]
    dependencies:
      - package: swift-markdown
        product: Markdown
    entitlements:
      path: MDEdit.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
        com.apple.security.network.client: true
        com.apple.security.network.server: true
        com.apple.security.print: true
    info:
      path: Sources/MDEdit/Info.plist
      properties:
        CFBundleName: MDEdit
        CFBundleDisplayName: MDEdit
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: ""
        CFBundleDocumentTypes:
          - CFBundleTypeName: Markdown
            CFBundleTypeRole: Editor
            LSItemContentTypes: [net.daringfireball.markdown]
          - CFBundleTypeName: Folder
            CFBundleTypeRole: Viewer
            LSItemContentTypes: [public.folder]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: in.ranjeev.mdedit
        ENABLE_HARDENED_RUNTIME: true
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          # no get-task-allow: it would let any process of the same user attach to the app and read the open documents
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: false
  MDEditTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/MDEditTests]
    dependencies:
      - target: MDEdit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: in.ranjeev.mdedit.tests
schemes:
  MDEdit:
    build:
      targets:
        MDEdit: all
        MDEditTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets: [MDEditTests]
